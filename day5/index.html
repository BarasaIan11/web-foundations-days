<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Directory</title>
    <link rel="stylesheet" href="style.css" />
    <script src="users.js" defer></script>
  </head>
  <body>
    <main>
      <h1>User Directory</h1>
      <button id="load-users" type="button">Load users</button>

      <p>
        <label for="filter-input">Filter users by name</label>
        <input id="filter-input" type="search" placeholder="Start typing a name" />
      </p>

      <p id="status" aria-live="polite"></p>
      <ul id="users-list"></ul>
    </main>
  </body>
</html>
